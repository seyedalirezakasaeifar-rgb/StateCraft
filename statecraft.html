<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#394b48">
<title>Statecraft</title>
<style>
/* STATECRAFT — stylesheet. Dark navy palette, circular icon nodes, coloured rings. */
:root {
  --bg: #0a101c; --bg2: #0e1626; --panel: #131e33; --panel2: #1a2841; --line: #25365a; --line2: #314672;
  --text: #e8eefb; --dim: #8fa2c6; --dim2: #62779f; --amber: #ffb84a; --good: #44d38a; --bad: #ff5d66; --blue: #58a6ff;
  --violet: #9d7bff; --radius: 14px; --fs: 15px;
  --sat: env(safe-area-inset-top, 0px); --sab: env(safe-area-inset-bottom, 0px);
  --font: Roboto, "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
}
body.cb { --good: #4aa8ff; --bad: #ffa03a; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: var(--font); font-size: var(--fs); overflow: hidden; overscroll-behavior: none; user-select: none; -webkit-user-select: none; }
body { background: radial-gradient(120% 80% at 50% 0%, #15233f 0%, var(--bg) 60%); }
button { font: inherit; color: inherit; }
h1, h2, h3, h4 { margin: 0; font-weight: 600; letter-spacing: .01em; }
small, .dim { color: var(--dim); }
.good { color: var(--good); } .bad { color: var(--bad); } .amber { color: var(--amber); } .blue { color: var(--blue); }
.hidden { display: none !important; }
.ic { display: block; }

#app { position: fixed; inset: 0; display: flex; flex-direction: column; max-width: 720px; margin: 0 auto; }

/* ---------- shell ---------- */
.topbar { flex: none; display: flex; align-items: center; gap: 8px; padding: calc(var(--sat) + 8px) 12px 8px; background: linear-gradient(#0c1424, #0c1424e6); border-bottom: 1px solid var(--line); z-index: 5; }
.topbar .date { display: flex; flex-direction: column; line-height: 1.1; min-width: 74px; }
.topbar .date b { font-size: 15px; } .topbar .date small { font-size: 11px; }
.pill { display: flex; align-items: center; gap: 6px; background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 5px 10px 5px 6px; font-size: 13px; font-weight: 600; white-space: nowrap; }
.pill .ic { color: var(--amber); }
.pill.pc { color: var(--amber); border-color: #6b4d1a; background: #261c0c; }
.pill.pc small { color: #c79a4f; font-weight: 500; }
.pill.pop { padding: 2px 10px 2px 2px; }
.topbar .spacer { flex: 1; }
.content { flex: 1; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; padding: 10px 12px 130px; position: relative; }
.content.flush { padding: 0; overflow: hidden; }
.bottomnav { flex: none; display: flex; background: #0b1322; border-top: 1px solid var(--line); padding-bottom: var(--sab); z-index: 5; }
.bottomnav button { flex: 1; background: none; border: 0; padding: 7px 0 6px; display: flex; flex-direction: column; align-items: center; gap: 2px; color: var(--dim2); font-size: 10.5px; position: relative; }
.bottomnav button.on { color: var(--text); }
.bottomnav button.on::before { content: ''; position: absolute; top: 0; left: 28%; right: 28%; height: 2px; background: var(--amber); border-radius: 2px; }
.bottomnav .badge { position: absolute; top: 3px; right: calc(50% - 20px); background: var(--bad); color: #fff; font-size: 9px; border-radius: 8px; padding: 1px 5px; font-weight: 700; }
.endturn { position: absolute; right: 12px; bottom: calc(68px + var(--sab)); z-index: 6; display: flex; align-items: center; gap: 8px; border: 0; border-radius: 999px; padding: 12px 18px; background: linear-gradient(135deg, #ffc55a, #f0952b); color: #2a1800; font-weight: 700; font-size: 15px; box-shadow: 0 6px 20px #0009, 0 0 0 1px #ffffff30 inset; }
.endturn small { color: #5a3a08; font-weight: 600; font-size: 11px; display: block; line-height: 1; }
.endturn:active { transform: scale(.97); }

/* ---------- cards & lists ---------- */
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px; margin-bottom: 10px; }
.card.tight { padding: 8px 10px; }
.card h3 { font-size: 14px; color: var(--dim); text-transform: uppercase; letter-spacing: .08em; font-weight: 600; margin-bottom: 8px; }
.card.hl { border-color: #6b4d1a; background: linear-gradient(#1f1a10, var(--panel)); }
.section-title { font-size: 12px; color: var(--dim); text-transform: uppercase; letter-spacing: .1em; margin: 14px 2px 6px; font-weight: 600; }
.row { display: flex; align-items: center; gap: 10px; }
.row.top { align-items: flex-start; }
.grow { flex: 1; min-width: 0; }
.between { justify-content: space-between; }
.wrap { flex-wrap: wrap; }
.gap4 { gap: 4px; } .gap8 { gap: 8px; }
.ellipsis { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kv { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid #1d2b47; font-size: 14px; }
.kv:last-child { border: 0; }
.tag { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 999px; background: var(--panel2); border: 1px solid var(--line2); color: var(--dim); }
.tag.good { color: var(--good); border-color: #1d5a3c; background: #10251c; } .tag.bad { color: var(--bad); border-color: #5e242a; background: #2a1316; }
.tag.amber { color: var(--amber); border-color: #6b4d1a; background: #261c0c; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stat-tile { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px; }
.stat-tile b { font-size: 20px; display: block; } .stat-tile small { font-size: 11px; }

/* ---------- buttons ---------- */
.btn { border: 1px solid var(--line2); background: var(--panel2); color: var(--text); padding: 10px 14px; border-radius: 12px; font-weight: 600; font-size: 14px; }
.btn:active { transform: scale(.98); background: #22365a; }
.btn.primary { background: linear-gradient(135deg, #ffc55a, #f0952b); color: #2a1800; border: 0; }
.btn.danger { background: #3a1a20; border-color: #6e2a33; color: #ffb3b8; }
.btn.ghost { background: transparent; }
.btn.small { padding: 6px 10px; font-size: 12.5px; border-radius: 10px; }
.btn.block { display: block; width: 100%; }
.btn[disabled] { opacity: .4; pointer-events: none; }
.iconbtn { width: 38px; height: 38px; border-radius: 50%; border: 1px solid var(--line2); background: var(--panel2); display: grid; place-items: center; padding: 0; }

/* ---------- chips & tabs ---------- */
.chips { display: flex; gap: 6px; overflow-x: auto; padding: 2px 0 8px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; display: flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 999px; background: var(--panel); border: 1px solid var(--line); color: var(--dim); font-size: 13px; white-space: nowrap; }
.chip.on { background: var(--panel2); color: var(--text); border-color: var(--chipc, var(--amber)); box-shadow: 0 0 0 1px var(--chipc, var(--amber)) inset; }
.chip .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--chipc, var(--dim)); }
.subtabs { display: flex; gap: 2px; background: #0b1322; border-radius: 12px; padding: 3px; margin-bottom: 10px; border: 1px solid var(--line); }
.subtabs button { flex: 1; border: 0; background: none; padding: 8px 4px; border-radius: 9px; color: var(--dim); font-size: 13px; font-weight: 600; }
.subtabs button.on { background: var(--panel2); color: var(--text); }

/* ---------- node icons ---------- */
.nic { display: inline-block; flex: none; position: relative; }
.nic svg { display: block; }
.nic .delta { position: absolute; right: -2px; bottom: -2px; font-size: 10px; font-weight: 700; background: #0b1322; border-radius: 8px; padding: 0 3px; border: 1px solid var(--line); }

/* ---------- bars ---------- */
.bar { height: 7px; background: #0b1322; border-radius: 4px; overflow: hidden; position: relative; border: 1px solid #1d2b47; }
.bar > i { display: block; height: 100%; border-radius: 4px; background: var(--blue); }
.bar.thick { height: 11px; }
.bar .mark { position: absolute; top: -2px; bottom: -2px; width: 2px; background: #fff; opacity: .7; }
.cmpbar { display: flex; height: 12px; border-radius: 6px; overflow: hidden; background: #0b1322; }
.cmpbar i { display: block; height: 100%; }
.sbar { position: relative; height: 8px; background: #0b1322; border-radius: 4px; border: 1px solid #1d2b47; }
.sbar::before { content: ''; position: absolute; left: 50%; top: -2px; bottom: -2px; width: 1px; background: #ffffff55; }
.sbar i { position: absolute; top: 0; bottom: 0; border-radius: 3px; }

/* ---------- slider ---------- */
.slider { -webkit-appearance: none; appearance: none; width: 100%; height: 30px; background: transparent; margin: 0; touch-action: pan-y; }
.slider::-webkit-slider-runnable-track { height: 8px; border-radius: 4px; background: linear-gradient(90deg, var(--sc, var(--amber)) var(--p, 50%), #0b1322 var(--p, 50%)); border: 1px solid #1d2b47; }
.slider::-webkit-slider-thumb { -webkit-appearance: none; width: 26px; height: 26px; border-radius: 50%; background: #fff; border: 4px solid var(--sc, var(--amber)); margin-top: -10px; box-shadow: 0 2px 6px #0008; }
.slider .tick { }
.steps { display: flex; justify-content: space-between; padding: 0 12px; margin-top: -4px; }
.steps i { width: 2px; height: 5px; background: #ffffff33; }
.stepper { display: flex; align-items: center; gap: 4px; }
.stepper button { width: 38px; height: 38px; border-radius: 50%; border: 1px solid var(--line2); background: var(--panel2); font-size: 20px; font-weight: 700; line-height: 1; }

/* ---------- policy card ---------- */
.pcard { background: var(--panel); border: 1px solid var(--line); border-left: 4px solid var(--cc, var(--line)); border-radius: 12px; padding: 10px 12px 6px; margin-bottom: 8px; }
.pcard.staged { border-color: var(--amber); background: linear-gradient(#1b1a14, var(--panel)); }
.pcard .val { font-size: 17px; font-weight: 700; }
.pcard .sub { font-size: 12px; color: var(--dim); }
.pcard .meta { display: flex; gap: 10px; font-size: 11.5px; color: var(--dim); margin-top: 2px; flex-wrap: wrap; }
.pcard .ctrl { margin-top: 2px; }

/* ---------- sheets & modals ---------- */
.layer { position: fixed; inset: 0; z-index: 50; pointer-events: none; }
.layer > * { pointer-events: auto; }
.backdrop { position: absolute; inset: 0; background: #02060dcc; animation: fade .18s ease; }
.sheet { position: absolute; left: 0; right: 0; bottom: 0; max-width: 720px; margin: 0 auto; max-height: 92%; background: var(--bg2); border-top: 1px solid var(--line2); border-radius: 22px 22px 0 0; display: flex; flex-direction: column; animation: up .22s cubic-bezier(.2, .8, .2, 1); box-shadow: 0 -10px 40px #000a; }
.sheet .grab { width: 40px; height: 4px; border-radius: 2px; background: var(--line2); margin: 8px auto 4px; flex: none; }
.sheet .sh-head { flex: none; display: flex; align-items: center; gap: 10px; padding: 6px 14px 10px; border-bottom: 1px solid var(--line); }
.sheet .sh-body { flex: 1; overflow-y: auto; padding: 12px 14px calc(18px + var(--sab)); -webkit-overflow-scrolling: touch; }
.modal { position: absolute; left: 12px; right: 12px; top: 50%; transform: translateY(-50%); max-width: 600px; margin: 0 auto; max-height: 88%; background: var(--bg2); border: 1px solid var(--line2); border-radius: 20px; display: flex; flex-direction: column; animation: pop .22s cubic-bezier(.2, .8, .2, 1); box-shadow: 0 20px 60px #000c; }
.modal.full { top: calc(var(--sat) + 10px); bottom: calc(var(--sab) + 10px); transform: none; max-height: none; }
.modal .m-head { padding: 16px 16px 8px; }
.modal .m-body { flex: 1; overflow-y: auto; padding: 4px 16px 12px; -webkit-overflow-scrolling: touch; }
.modal .m-foot { padding: 10px 16px 16px; display: flex; gap: 8px; }
.modal .m-foot .btn { flex: 1; }
@keyframes up { from { transform: translateY(40px); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes pop { from { transform: translateY(-46%) scale(.96); opacity: 0; } to { transform: translateY(-50%); opacity: 1; } }
.modal.full { animation: fade .2s; }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }

/* ---------- dilemma ---------- */
.dilemma .hero { display: flex; align-items: center; gap: 14px; margin-bottom: 8px; }
.dilemma .hero .big { width: 56px; height: 56px; border-radius: 50%; display: grid; place-items: center; background: #1c2946; border: 2px solid var(--amber); color: var(--amber); flex: none; }
.dilemma h2 { font-size: 19px; line-height: 1.2; }
.dilemma p { color: #c6d3ef; line-height: 1.45; margin: 8px 0 12px; }
.opt { width: 100%; text-align: left; background: var(--panel); border: 1px solid var(--line2); border-radius: 14px; padding: 12px; margin-bottom: 8px; display: block; }
.opt:active { background: var(--panel2); border-color: var(--amber); }
.opt b { font-size: 15px; display: block; margin-bottom: 5px; }
.opt .fx { display: flex; flex-wrap: wrap; gap: 4px; }
.fx span { font-size: 11px; padding: 2px 7px; border-radius: 8px; background: #0b1322; border: 1px solid var(--line); color: var(--dim); }
.fx span.good { color: var(--good); border-color: #1d5a3c; } .fx span.bad { color: var(--bad); border-color: #5e242a; } .fx span.amber { color: var(--amber); }
.result { background: #0f2218; border: 1px solid #1d5a3c; border-radius: 12px; padding: 10px 12px; margin: 8px 0; }

/* ---------- news ---------- */
.news { border-left: 3px solid var(--nc, var(--line2)); padding: 6px 10px; margin-bottom: 8px; background: var(--panel); border-radius: 0 10px 10px 0; }
.news small { font-size: 10.5px; text-transform: uppercase; letter-spacing: .08em; }
.news b { font-size: 14px; display: block; margin-top: 2px; line-height: 1.25; }

/* ---------- misc ---------- */
.portrait { border-radius: 50%; background: #1c2946; flex: none; overflow: hidden; border: 2px solid var(--line2); }
.toast { position: fixed; left: 50%; bottom: calc(130px + var(--sab)); transform: translateX(-50%); background: #0b1322f2; border: 1px solid var(--line2); padding: 9px 16px; border-radius: 999px; font-size: 13px; z-index: 80; animation: toast 2.4s forwards; max-width: 88%; text-align: center; pointer-events: none; }
@keyframes toast { 0% { opacity: 0; transform: translate(-50%, 10px); } 10% { opacity: 1; transform: translate(-50%, 0); } 85% { opacity: 1; } 100% { opacity: 0; } }
.hr { height: 1px; background: var(--line); margin: 10px 0; }
.search { width: 100%; padding: 10px 14px; border-radius: 12px; background: #0b1322; border: 1px solid var(--line2); color: var(--text); font: inherit; user-select: text; -webkit-user-select: text; }
textarea.search { min-height: 140px; font-family: monospace; font-size: 12px; }
.switch { position: relative; width: 46px; height: 26px; border-radius: 13px; background: #0b1322; border: 1px solid var(--line2); flex: none; }
.switch::after { content: ''; position: absolute; left: 2px; top: 2px; width: 20px; height: 20px; border-radius: 50%; background: var(--dim); transition: .15s; }
.switch.on { background: #3a2a0c; border-color: var(--amber); } .switch.on::after { left: 22px; background: var(--amber); }
.effect-row { display: flex; align-items: center; gap: 8px; padding: 6px 0; border-bottom: 1px solid #1a2843; }
.effect-row:last-child { border: 0; }
.effect-row .nm { flex: 1; min-width: 0; font-size: 13.5px; }
.effect-row .w { width: 90px; flex: none; }
.preview-arrow { font-size: 11px; font-weight: 700; }

/* ---------- board ---------- */
.boardwrap { position: absolute; inset: 0; background: radial-gradient(circle at 50% 50%, #12203a 0%, #0a101c 70%); touch-action: none; overflow: hidden; }
.boardwrap svg { width: 100%; height: 100%; display: block; }
.board-hud { position: absolute; left: 10px; right: 10px; bottom: calc(130px + var(--sab)); z-index: 3; pointer-events: none; }
.board-hud > * { pointer-events: auto; }
.board-card { background: #0c1424f0; border: 1px solid var(--line2); border-radius: 16px; padding: 10px 12px; display: flex; gap: 10px; align-items: center; }
.board-top { position: absolute; left: 10px; right: 10px; top: 10px; z-index: 3; display: flex; gap: 8px; }
.board-top .search { flex: 1; padding: 8px 12px; font-size: 14px; }
.board-legend { position: absolute; left: 10px; top: 56px; z-index: 3; display: flex; flex-direction: column; gap: 3px; font-size: 10.5px; color: var(--dim); background: #0a1120cc; padding: 6px 8px; border-radius: 10px; border: 1px solid var(--line); }
.board-legend span::before { content: ''; display: inline-block; width: 14px; height: 3px; border-radius: 2px; margin-right: 6px; vertical-align: middle; background: var(--c); }
.search-res { position: absolute; left: 10px; right: 10px; top: 52px; z-index: 4; background: #0c1424f8; border: 1px solid var(--line2); border-radius: 12px; max-height: 50%; overflow-y: auto; }
.search-res button { display: flex; width: 100%; align-items: center; gap: 10px; padding: 8px 12px; background: none; border: 0; border-bottom: 1px solid #1a2843; text-align: left; }

/* ---------- menu ---------- */
.menu-screen { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center; padding: 24px; overflow-y: auto; }
.logo { text-align: center; margin-bottom: 26px; }
.logo h1 { font-size: 42px; letter-spacing: .28em; font-weight: 300; margin-right: -.28em; }
.logo h1 b { font-weight: 700; color: var(--amber); }
.logo small { letter-spacing: .3em; text-transform: uppercase; font-size: 11px; }
.menu-btn { display: flex; align-items: center; gap: 14px; width: 100%; padding: 15px 18px; margin-bottom: 10px; border-radius: 16px; background: var(--panel); border: 1px solid var(--line2); font-size: 16px; font-weight: 600; text-align: left; }
.menu-btn:active { background: var(--panel2); }
.menu-btn small { display: block; font-weight: 400; font-size: 12px; margin-top: 2px; }
.menu-btn.primary { background: linear-gradient(135deg, #ffc55a, #f0952b); color: #2a1800; border: 0; }
.menu-btn.primary small { color: #6b450c; }

/* country picker */
.cgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.ccard { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 10px; text-align: left; position: relative; overflow: hidden; }
.ccard.on { border-color: var(--amber); box-shadow: 0 0 0 1px var(--amber) inset; }
.ccard .flag { height: 6px; display: flex; border-radius: 3px; overflow: hidden; margin-bottom: 7px; }
.ccard .flag i { flex: 1; }
.ccard b { display: block; font-size: 14px; } .ccard small { font-size: 11px; }
.diff { display: flex; gap: 4px; margin-top: 4px; } .diff i { width: 12px; height: 4px; border-radius: 2px; background: #22324f; } .diff i.on { background: var(--amber); }
.party-opt { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--panel); margin-bottom: 6px; width: 100%; text-align: left; }
.party-opt.on { border-color: var(--amber); }
.party-opt .sw { width: 16px; height: 34px; border-radius: 4px; flex: none; }

/* ideology */
.ideo { margin: 6px 0; } .ideo .labels { display: flex; justify-content: space-between; font-size: 10.5px; color: var(--dim); }
.ideo .track { position: relative; height: 6px; background: #0b1322; border-radius: 3px; margin: 4px 0; }
.ideo .dot { position: absolute; top: -4px; width: 14px; height: 14px; border-radius: 50%; border: 2px solid #fff; transform: translateX(-50%); }

.legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 12px; margin: 6px 0; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
svg text { font-family: var(--font); fill: var(--dim); }
.chart text { font-size: 10px; }
.tip { font-size: 12.5px; color: var(--dim); line-height: 1.4; }
.tutorial { position: fixed; left: 12px; right: 12px; bottom: calc(150px + var(--sab)); z-index: 60; background: #13203a; border: 1px solid var(--amber); border-radius: 16px; padding: 12px 14px; box-shadow: 0 10px 40px #000a; max-width: 600px; margin: 0 auto; }

/* CABINET EDITION — parchment reports, brass controls and a green government desk. */
:root {
  --bg:#e7e1d2; --bg2:#f2eee5; --panel:#faf7ef; --panel2:#ebe5d7;
  --line:#c8bea9; --line2:#a79c86; --text:#263b37; --dim:#716d60; --dim2:#79786d;
  --amber:#966d2e; --good:#356a4b; --bad:#a34235; --blue:#496e7c; --violet:#755d7c;
  --radius:3px; --font:"Segoe UI",Tahoma,Arial,sans-serif; --fs:14px;
}
body {background:repeating-linear-gradient(0deg,#e7e1d2 0,#e7e1d2 2px,#e9e3d5 3px,#e7e1d2 4px);}
h1,h2 {font-family:Georgia,"Times New Roman",serif;font-weight:400;letter-spacing:-.015em;}
h1 {font-size:36px;} h2 {font-size:25px;}
#app {max-width:none;}
#app.game-shell {display:grid;grid-template-columns:176px 1fr;grid-template-rows:64px minmax(0,1fr) 61px;grid-template-areas:"nav top" "nav content" "nav footer";max-width:1600px;box-shadow:0 0 45px #263b3722;border-left:1px solid var(--line);border-right:1px solid var(--line);}
.topbar {grid-area:top;background:linear-gradient(#fbf8f0,#eae3d5);border-bottom:1px solid var(--line2);padding:10px 24px;gap:12px;box-shadow:0 1px 0 #fff inset;}
.office-brand {display:flex;align-items:center;gap:8px;margin-right:16px;color:#435b52;}
.office-brand b {letter-spacing:.15em;font-size:12px;}
.office-brand small {font-size:9px;letter-spacing:.1em;border-left:1px solid var(--line);padding-left:9px;}
.topbar .date b {font-size:13px;}
.pill {border-radius:3px;background:#f5f0e6;padding:5px 9px;font-size:12px;color:var(--text);border-color:var(--line);}
.pill.pc {color:#855c25;background:#f3ead1;border-color:#c7b789;}
.pill.pc small {color:#927846;}
.content {grid-area:content;padding:25px 30px 28px;overflow-y:auto;background:transparent;}

/* STATECRAFT — core utilities */

  nations: [], outlets: [], actions: [], traits: [], headlines: {}, names: {}, drift: [], legacy: [] };

SC.clamp = (x, a = 0, b = 1) => x < a ? a : x > b ? b : x;
SC.lerp = (a, b, t) => a + (b - a) * t;

SC.rand = function (S) { // S: object with numeric field "rs"
  S.rs = (S.rs + 0x6D2B79F5) | 0;

SC.GP = (id, name, icon, def, likes, o) => SC.D.groups.push(Object.assign({ id, name, icon, def, likes: likes || '' }, o || {}));

SC.D.vars = [];

/* E(id, title, text, when, weight, cooldown, options[[label, effects, result]], extra) */

  o: (o || []).map(a => ({ l: a[0], e: a[1] || {}, r: a[2] || '' }))

<script>
/* STATECRAFT — the simulation graph.
   Every stat, policy, situation, derived variable and voter group is a node. Effects are directed weighted edges.
   Values are normalised 0..1 and compared against a reference (start value) so that a fresh game is in equilibrium. */

SC.parseFx = function (str) {
  const out = [];
  if (!str) return out;
  for (const tok of String(str).trim().split(/\s+/)) {
    if (!tok) continue;
    const m = tok.match(/^([a-z0-9_]+):(-?[0-9]*\.?[0-9]+)([a-z]?)$/);
    if (!m) throw new Error('Bad effect token "' + tok + '"');
    out.push({ t: m[1], w: parseFloat(m[2]), c: m[3] || '' });
  }
  return out;
};

/* Response curves applied to the deviation dx of a source from its reference */
SC.curve = function (c, dx) {
  switch (c) {
    case 'd': return dx < 0 ? -Math.pow(-dx, .6) : Math.pow(dx, .6);
    case 'a': return dx < 0 ? -Math.pow(-dx, 1.6) : Math.pow(dx, 1.6);
    case 'u': return Math.abs(dx);
    case 'p': return dx > 0 ? dx : 0;
    case 'n': return dx < 0 ? dx : 0;
    default: return dx;
  }
};

SC.reg = null;
SC.build = function () {
  const N = {}, list = [], E = { out: {}, inn: {}, all: [] }, errors = [];
  const add = n => { if (N[n.id]) errors.push('Duplicate node id: ' + n.id); N[n.id] = n; list.push(n); E.out[n.id] = []; E.inn[n.id] = []; };
  for (const s of SC.D.stats) add(Object.assign({ type: 'stat' }, s));
  for (const v of SC.D.vars) add(Object.assign({ type: 'var', start: .5, rate: 1 }, v));
  for (const p of SC.D.policies) {
    const steps = p.steps || 10;
    add(Object.assign({}, p, { type: 'policy', steps, s: p.s == null ? .5 : p.s, pc: p.pc == null ? 2 : p.pc, impl: p.impl || 1, dept: SC.PCATS[p.cat] ? SC.PCATS[p.cat].d : 'cabinet' }));
  }
  for (const s of SC.D.situations) add(Object.assign({ type: 'situation', cat: 'sit' }, s));
  for (const g of SC.D.groups) add(Object.assign({ type: 'group' }, g));

  const edge = (from, to, w, c, kind) => {
    if (!N[from]) { errors.push('Unknown source "' + from + '" -> ' + to); return; }
    if (!N[to]) { errors.push('Unknown target "' + to + '" from ' + from); return; }
    const e = { from, to, w, c: c || '', kind: kind || 'fx' };
    E.out[from].push(e); E.inn[to].push(e); E.all.push(e);
  };
  for (const n of list) {
    if (n.type === 'group') {
      n.likesP = SC.parseFx(n.likes);
      for (const l of n.likesP) edge(l.t, n.id, l.w, l.c, 'like');
    } else {
      n.fxP = SC.parseFx(n.fx);
      for (const f of n.fxP) edge(n.id, f.t, f.w, f.c, 'fx');
    }
    if (n.type === 'policy' && n.i) n.iP = SC.parseFx(n.i); // ideology tags
    if (n.type === 'situation') {
      const conds = n.cond.split('&').map(c => { const m = c.match(/^([a-z_0-9]+)([<>])(-?[0-9.]+)$/); if (!m) { errors.push('Bad situation cond ' + n.id + ': ' + c); return null; } return { id: m[1], op: m[2], v: parseFloat(m[3]) }; }).filter(Boolean);
      n.conds = conds;
      for (const c of conds) if (!N[c.id]) errors.push('Situation ' + n.id + ' uses unknown stat ' + c.id);
    }
  }
  /* Ideology tag axes must be valid */
  for (const n of list) if (n.iP) for (const t of n.iP) if (SC.AX.indexOf(t.t) < 0) errors.push('Bad ideology axis ' + t.t + ' on ' + n.id);
  /* Group rule compile */
  for (const g of SC.D.groups) N[g.id].rule = SC.compileRule(g.def, N, errors, g.id);
  /* drift rules */
  for (const d of SC.D.drift) if (!N[d[0]]) errors.push('Unknown drift stat ' + d[0]);
  SC.reg = { N, list, E, errors };
  return SC.reg;
};

/* Membership rules: 'inc<@poverty&age>0.3' -> array of terms */
SC.LATENTS = ['inc', 'age', 'edu', 'rel', 'urb', 'eth', 'imm', 'pub', 'self', 'agr', 'gen', 'lgb', 'par', 'stu', 'car', 'own', 'smk', 'gun', 'dis', 'vet', 'wrk', 'tec', 'drg'];
SC.compileRule = function (def, N, errors, gid) {
  if (def === 'all') return { all: true, terms: [] };
  const terms = [];
  for (const part of def.split('&')) {
    const m = part.match(/^([a-z]+)([<>])(.+)$/);
    if (!m) { errors.push('Bad rule "' + part + '" in ' + gid); continue; }
    const key = m[1], op = m[2]; let val = m[3];
    const isLat = SC.LATENTS.indexOf(key) >= 0, isAx = SC.AX.indexOf(key) >= 0;
    if (!isLat && !isAx) errors.push('Bad rule key "' + key + '" in ' + gid);
    let stat = null, inv = false, k = 1, num = null;
    if (val[0] === '@') {
      val = val.slice(1); if (val[0] === '!') { inv = true; val = val.slice(1); }
      const mm = val.match(/^([a-z_0-9]+)(?:\*([0-9.]+))?$/);
      if (!mm) { errors.push('Bad rule value in ' + gid + ': ' + m[3]); continue; }
      stat = mm[1]; k = mm[2] ? parseFloat(mm[2]) : 1;
      if (!N[stat]) errors.push('Rule in ' + gid + ' uses unknown stat ' + stat);
    } else num = parseFloat(val);
    terms.push({ key, op, stat, inv, k, num, lat: isLat });
  }
  return { all: false, terms };
};

/* Display helpers ------------------------------------------------------ */
SC.parseFmt = function (f) {
  if (!f || f === 'i') return { t: 'i' };
  const p = f.split(':');
  if (p[0] === 'p') return { t: 'p', lo: +p[1], hi: +p[2] };
  if (p[0] === 'n') return { t: 'n', lo: +p[1], hi: +p[2], unit: p[3] || '', dec: p[4] == null ? 1 : +p[4] };
  return { t: 'i' };
};
/* value (0..1) -> display string */
SC.fmtVal = function (node, v) {
  const f = node._f || (node._f = SC.parseFmt(node.type === 'policy' ? node.u : node.fmt));
  if (f.t === 'i') return Math.round(v * 100).toString();
  const x = f.lo + (f.hi - f.lo) * v;
  if (f.t === 'p') return x.toFixed(Math.abs(f.hi - f.lo) <= 40 ? 1 : 0) + '%';
  return x.toFixed(f.dec) + f.unit;
};
/* display share used by group rules (0..1) */
SC.shareOf = function (node, v) {
  const f = node._f || (node._f = SC.parseFmt(node.fmt));
  if (f.t === 'p') return (f.lo + (f.hi - f.lo) * v) / 100;
  return v;
};

<script>
/* STATECRAFT — voter simulation.
   A synthetic electorate of individual voters. Each has latent traits (income, age, religiosity ...), a 5D ideology,
   and belongs to overlapping groups. Groups react to policies and conditions; voters combine group moods with ideology
   to choose between parties. Ideologies drift over time, so group sizes change as you govern. */

SC.AXW = [1.0, .75, .6, .55, .7];
SC.NVOTERS = 2400;

SC.genVoters = function (C, regions, seed, N) {
  N = N || SC.NVOTERS;
  const r = SC.mkRng((seed ^ 0x9e3779b9) | 0), g = () => SC.gauss(r);
  const vt = { n: N, reg: new Uint8Array(N), lat: {}, ido: new Float32Array(N * 5), ido0: new Float32Array(N * 5),
    bias: new Float32Array(N * 3), aud: new Int8Array(N).fill(-1), noise: new Float32Array(N), tb: new Float32Array(N),
    p: new Float32Array(N * 3), t: new Float32Array(N), h: new Float32Array(N), mem: [], memN: [], elig: new Uint8Array(N) };
  for (const k of SC.LATENTS) vt.lat[k] = new Float32Array(N);
  const cum = []; let tot = 0; for (const rg of regions) { tot += rg.pop; cum.push(tot); }
  const nrm = (parts, sd) => { let v = sd * sd; for (const c of parts) v += c * c; return Math.sqrt(v); };
  const ctr = C.centre || [0, 0, 0, 0, 0];
  const L = vt.lat; const zis = new Float64Array(N);
  for (let i = 0; i < N; i++) {
    const x = r() * tot; let ri = 0; while (cum[ri] < x) ri++;
    const R = regions[ri]; vt.reg[i] = ri;
    const zi = g() + R.wealth * .8, ze = .35 * zi + .93 * g() + R.edu * .6;
    const age = r(), za = (age - .5) * 3.4;
    const zr = .9 * g() + .3 * za - .25 * ze + R.rel;
    const zu = (R.urban * 2 - 1) + .6 * g();
    zis[i] = zi;
    L.edu[i] = SC.ncdf(ze / 1.05);
    L.age[i] = age;
    L.rel[i] = SC.ncdf(zr / nrm([.9, .3, .25], 0) * 1.0);
    L.urb[i] = SC.ncdf(zu * 1.2 / 1.3);
    L.eth[i] = SC.ncdf((g() + R.eth) / 1.1);
    L.imm[i] = SC.ncdf((.6 * g() + .5 * (L.eth[i] - .5) * 2 + R.eth * .5) / 0.85);
    L.pub[i] = SC.ncdf((g() - .3 * ze) / 1.05);
    L.self[i] = SC.ncdf((g() - .25 * zi) / 1.03);
    L.agr[i] = SC.ncdf((g() + 1.2 * zu) / 1.55);
    L.gen[i] = r(); L.lgb[i] = r(); L.par[i] = r(); L.stu[i] = r(); L.vet[i] = r();
    L.car[i] = SC.ncdf((g() + .8 * zu) / 1.28);
    L.own[i] = SC.ncdf((g() - .6 * zi - .5 * za) / 1.3);
    L.smk[i] = SC.ncdf((g() - .3 * ze - .2 * zi) / 1.06);
    L.gun[i] = SC.ncdf((g() + .5 * zu + R.rel * .4) / 1.13);
    L.dis[i] = SC.ncdf((g() - .4 * za) / 1.08);
    L.wrk[i] = SC.ncdf((.5 * zi + g()) / 1.12);
    L.tec[i] = SC.ncdf((g() - .6 * ze - .4 * zu) / 1.25);
    L.drg[i] = SC.ncdf((g() + .5 * za + .3 * zr) / 1.14);
    /* ideology */
    const soc = (.55 * zr + .3 * za - .3 * ze + .6 * g());
    const sN = nrm([.55, .3, .3], .6);
    const raw = [
      (.5 * zi + .7 * g()) / nrm([.5], .7) + R.ilean[0] * 1.5,
      soc / sN + R.ilean[1] * 1.0,
      (.35 * soc / sN - .25 * ze + .15 * za + .7 * g()) / nrm([.35, .25, .15], .7),
      (.3 * za + .15 * zi - .3 * ze - .2 * zu + .7 * g()) / nrm([.3, .15, .3, .2], .7),
      (.3 * soc / sN - .4 * ze - .25 * zu + .15 * za + .65 * g()) / nrm([.3, .4, .25, .15], .65)
    ];
    for (let a = 0; a < 5; a++) { const v = SC.clamp(raw[a] * .55 + ctr[a], -1, 1); vt.ido[i * 5 + a] = v; vt.ido0[i * 5 + a] = v; }
    for (let p = 0; p < 3; p++) vt.bias[i * 3 + p] = g() * .22;
    vt.noise[i] = g() * .04;
    vt.tb[i] = SC.clamp(.42 + .28 * age + .12 * (L.edu[i] - .5) + .10 * (L.inc[i] - .5) + g() * .06, .15, .92);
  }
  const idx = Array.from({ length: N }, (_, i) => i).sort((a, b) => zis[a] - zis[b]);
  idx.forEach((i, rk) => { L.inc[i] = (rk + .5) / N; });
  return vt;
};

/* ---------- group membership ---------- */
SC.updateMembership = function (G) {
  const vt = G.vt, R = SC.reg, n = vt.n, groups = SC.D.groups;
  for (let gi = 0; gi < groups.length; gi++) {
    const node = R.N[groups[gi].id], rule = node.rule;
    if (!vt.mem[gi]) vt.mem[gi] = new Uint8Array(n);
    const mem = vt.mem[gi];
    if (rule.all) { mem.fill(1); vt.memN[gi] = n; continue; }
    const th = rule.terms.map(t => {
      if (t.stat) { const sn = R.N[t.stat]; let sh = SC.shareOf(sn, G.x[t.stat]) * t.k; if (t.inv) sh = 1 - sh; return SC.clamp(sh, 0, 1); }
      return t.num;
    });
    const arrs = rule.terms.map(t => t.lat ? vt.lat[t.key] : null);
    const axs = rule.terms.map(t => t.lat ? -1 : SC.AX.indexOf(t.key));
    let cnt = 0;
    for (let i = 0; i < n; i++) {
      let ok = 1;
      for (let k = 0; k < th.length; k++) {
        const t = rule.terms[k];
        const val = arrs[k] ? arrs[k][i] : vt.ido[i * 5 + axs[k]];
        if (t.op === '<' ? !(val < th[k]) : !(val > th[k])) { ok = 0; break; }
      }
      mem[i] = ok; cnt += ok;
    }
    vt.memN[gi] = cnt;
  }
  /* voting eligibility */
  const va = G.votingAge || 18;
  for (let i = 0; i < n; i++) vt.elig[i] = (16 + 74 * vt.lat.age[i]) >= va ? 1 : 0;
};

/* ---------- group moods ---------- */
SC.updateMoods = function (G) {
  const R = SC.reg;
  for (const gd of SC.D.groups) {
    const node = R.N[gd.id]; let dev = 0;
    for (const l of node.likesP) {
      const sn = R.N[l.t];
      const ref = G.vref[l.t];
      dev += l.w * SC.curve(l.c, G.x[l.t] - ref);
    }
    const tgt = dev + (G.moodMod[gd.id] || 0) + (G.dMood || 0) * (gd.id === 'everyone' ? 1 : 0);
    const cur = G.gm[gd.id] || 0;
    G.gm[gd.id] = cur + (SC.clamp(tgt, -.5, .5) - cur) * .40;
  }
  /* voters adapt to the new normal */
  for (const id in G.vref) {
    const n = R.N[id]; if (!n) continue;
    const ad = n.type === 'policy' ? .03 : n.type === 'situation' ? 0 : .016;
    G.vref[id] += (G.x[id] - G.vref[id]) * ad;
  }
};

/* ---------- voting ---------- */
SC.matchIdeo = function (vt, i, p) {
  let d = 0;
  for (let a = 0; a < 5; a++) { const df = vt.ido[i * 5 + a] - p[a]; d += SC.AXW[a] * df * df; }
  return 1 - Math.sqrt(d) / 2.2;
};

SC.computeVoting = function (G, shock) {
  const vt = G.vt, n = vt.n, R = SC.reg, groups = SC.D.groups, gEv = SC.D.groups.findIndex(g => g.id === 'everyone');
  const U = G.gm.everyone || 0;
  const kH = 2.7, kI = 2.5, kO = 1.7;
  const lead = 1.1 * (G.x.leader_approval - G.vref.leader_approval);
  const compulsory = G.x.compulsory_voting > .5;
  const pI = G.pIdeo;
  const gmArr = groups.map(g => G.gm[g.id] || 0);
  const nR = G.regions.length;
  const regSum = G.regions.map(() => [0, 0, 0, 0]);
  let sumT = 0, sumEl = 0; const tot = [0, 0, 0];
  const opp = G.oppBoost || [0, 0];
  const sh = shock || [0, 0, 0];
  const mediaTone = G.mediaTone || [];
  const u = [0, 0, 0], pr = [0, 0, 0];
  for (let i = 0; i < n; i++) {
    /* mood */
    let s = 0, c = 0;
    for (let gi = 0; gi < groups.length; gi++) if (gi !== gEv && vt.mem[gi][i]) { s += gmArr[gi]; c++; }
    const h = SC.clamp(.5 + U + (c ? 1.4 * s / c : 0) + vt.noise[i], 0, 1);
    vt.h[i] = h;
    const rg = G.regions[vt.reg[i]];
    let med = 0; if (vt.aud[i] >= 0) med = (mediaTone[vt.aud[i]] || 0);
    u[0] = kH * (h - .5) + kI * SC.matchIdeo(vt, i, pI[0]) + lead + .55 * med + G.incBias + (G.campBias || 0) + rg.lean[0] + (G.gov && G.gov.regions[vt.reg[i]] ? G.gov.regions[vt.reg[i]].voteBonus : 0) + vt.bias[i * 3] + sh[0];
    u[1] = kI * SC.matchIdeo(vt, i, pI[1]) + kO * (.5 - h) - .2 * med + rg.lean[1] + vt.bias[i * 3 + 1] + opp[0] + sh[1];
    u[2] = kI * SC.matchIdeo(vt, i, pI[2]) + kO * .75 * (.5 - h) - .1 * med + rg.lean[2] + vt.bias[i * 3 + 2] + opp[1] + sh[2] - .15;
    const m = Math.max(u[0], u[1], u[2]);
    const e0 = Math.exp(u[0] - m), e1 = Math.exp(u[1] - m), e2 = Math.exp(u[2] - m), z = e0 + e1 + e2;
    pr[0] = e0 / z; pr[1] = e1 / z; pr[2] = e2 / z;
    vt.p[i * 3] = pr[0]; vt.p[i * 3 + 1] = pr[1]; vt.p[i * 3 + 2] = pr[2];
    const pmax = Math.max(pr[0], pr[1], pr[2]);
    let t = SC.clamp(vt.tb[i] + .16 * (pmax - .45) + (G.turnoutMod || 0), .12, .95);
    if (compulsory) t = .55 * t + .45 * .95;
    if (!vt.elig[i]) t = 0;
    vt.t[i] = t; sumT += t; sumEl += vt.elig[i];
    tot[0] += t * pr[0]; tot[1] += t * pr[1]; tot[2] += t * pr[2];
    const rs = regSum[vt.reg[i]];
    rs[0] += t * pr[0]; rs[1] += t * pr[1]; rs[2] += t * pr[2]; rs[3] += t;
  }
  const shares = [tot[0] / sumT, tot[1] / sumT, tot[2] / sumT];
  G.poll = { s: shares, turnout: sumT / Math.max(1, sumEl), n: n };
  G.regShare = regSum.map(rs => rs[3] > 0 ? [rs[0] / rs[3], rs[1] / rs[3], rs[2] / rs[3]] : [.34, .33, .33]);
  G.regTurn = regSum.map(rs => rs[3]);
  /* group summaries */
  const gs = {};
  for (let gi = 0; gi < groups.length; gi++) {
    const mem = vt.mem[gi]; let cnt = 0, hs = 0, ts = 0, s0 = 0, s1 = 0, s2 = 0;
    for (let i = 0; i < n; i++) if (mem[i]) {
      cnt++; hs += vt.h[i]; const t = vt.t[i]; ts += t;
      s0 += t * vt.p[i * 3]; s1 += t * vt.p[i * 3 + 1]; s2 += t * vt.p[i * 3 + 2];
    }
    const sz = cnt / n;
    gs[groups[gi].id] = { size: sz, mood: cnt ? hs / cnt : .5, turnout: cnt ? ts / cnt : 0,
      sup: ts > 0 ? [s0 / ts, s1 / ts, s2 / ts] : [.34, .33, .33], n: cnt, weight: ts / Math.max(1, sumT) };
  }
  G.gs = gs;
  G.avgMood = (() => { let s = 0; for (let i = 0; i < n; i++) s += vt.h[i]; return s / n; })();
  return G.poll;
};

/* Fix incumbent bias so the opening poll matches the difficulty's target */
SC.calibrateBias = function (G, target) {
  G.incBias = 0;
  for (let k = 0; k < 14; k++) {
    SC.computeVoting(G, null);
    const err = target - G.poll.s[0];
    if (Math.abs(err) < .003) break;
    G.incBias += err * 3.2;
  }
};

/* ---------- ideology drift ---------- */
SC.driftIdeology = function (G) {
  const vt = G.vt, n = vt.n, R = SC.reg;
  const push = [0, 0, 0, 0, 0];
  for (const d of SC.D.drift) {
    const ai = SC.AX.indexOf(d[1]);
    push[ai] += d[2] * (G.x[d[0]] - G.vref[d[0]]) * 3.0 * (1 + 0);
  }
  /* persuasion by policy: enacted policy tags nudge the electorate toward that direction */
  for (const p of SC.D.policies) {
    const node = R.N[p.id]; if (!node.iP) continue;
    const dx = G.x[p.id] - G.ref[p.id];
    if (Math.abs(dx) < .001) continue;
    for (const tg of node.iP) push[SC.AX.indexOf(tg.t)] += tg.w * dx * .004;
  }
  for (let i = 0; i < n; i++) for (let a = 0; a < 5; a++) {
    const k = i * 5 + a;
    let v = vt.ido[k];
    v += push[a] + (vt.ido0[k] - v) * .006 + (G.rng() - .5) * .003;
    vt.ido[k] = v < -1 ? -1 : v > 1 ? 1 : v;
  }
};

/* Party ideology: the player's platform emerges from the laws they pass */
SC.updatePartyIdeology = function (G) {
  const R = SC.reg, base = G.pBase[0], sh = [0, 0, 0, 0, 0];
  for (const p of SC.D.policies) {
    const node = R.N[p.id]; if (!node.iP) continue;
    const dx = G.x[p.id] - G.ref[p.id];
    for (const tg of node.iP) sh[SC.AX.indexOf(tg.t)] += tg.w * dx * .55;
  }
  for (let a = 0; a < 5; a++) G.pIdeo[0][a] = SC.clamp(base[a] + sh[a] + (G.pDrift[a] || 0), -1, 1);
  /* opposition parties chase the electorate when they are losing */
  const mean = [0, 0, 0, 0, 0], vt = G.vt;
  for (let i = 0; i < vt.n; i++) for (let a = 0; a < 5; a++) mean[a] += vt.ido[i * 5 + a];
  for (let a = 0; a < 5; a++) mean[a] /= vt.n;
  for (let p = 1; p < 3; p++) {
    const rate = G.poll && G.poll.s[p] < G.poll.s[0] ? .014 : .004;
    for (let a = 0; a < 5; a++) G.pIdeo[p][a] += (mean[a] * .8 + G.pBase[p][a] * .2 - G.pIdeo[p][a]) * rate;
  }
};

<script>
/* STATECRAFT — economy & simulation update steps */

SC.polNorm = (G, id, useStaged) => {
  const n = SC.reg.N[id], st = useStaged && G.staged[id] != null ? G.staged[id] : G.pol[id].lvl;
  return st / n.steps;
};

/* ---- Budget --------------------------------------------------------- */
SC.budget = function (G, useTargets) {
  const R = SC.reg, gdp = G.eco.gdp, lines = [];
  let rev = 0, spend = 0, printed = 0;
  const corrOvh = 1 + .6 * (G.x.corruption - G.ref.corruption);
  for (const p of SC.D.policies) {
    const n = R.N[p.id];
    const x = useTargets ? SC.polNorm(G, p.id, true) : G.x[p.id];
    if (n.inc) {
      const laf = n.laf == null ? .4 : n.laf;
      let amt = n.inc * gdp * x * (1 - laf * x) * G.revScale * (1 - .55 * G.x.tax_evasion);
      if (p.id === 'income_tax' || p.id === 'payroll_tax') amt *= 1 - .8 * (G.x.unemployment - G.ref.unemployment);
      if (p.id === 'vat') amt *= 1 + .5 * (G.x.consumer_confidence - G.ref.consumer_confidence);
      if (p.id === 'corporation_tax') amt *= 1 + .8 * (G.x.corporate_profits - G.ref.corporate_profits);
      if (p.id === 'capital_gains_tax') amt *= 1 + 1.2 * (G.x.stock_market - G.ref.stock_market);
      if (p.id === 'property_tax') amt *= 1 + .5 * (G.x.house_prices - G.ref.house_prices);
      if (p.id === 'fuel_duty') amt *= 1 - .6 * (G.x.fuel_prices - G.ref.fuel_prices);
      if (p.id === 'tariffs') amt *= 1 + 1.5 * (G.x.trade_openness - G.ref.trade_openness) + .6 * (G.x.exports - G.ref.exports);
      amt = Math.max(0, amt);
      if (amt > 1e-9) { lines.push({ id: p.id, name: p.name, cat: p.cat, amt, kind: 'tax' }); rev += amt; }
    }
    if (n.cost) {
      const save = (G.dmSave && G.dmSave[n.dept]) || 0;
      let f = 1;
      if (p.id === 'unemployment_benefit') f = 1 + 2.5 * (G.x.unemployment - G.ref.unemployment);
      else if (p.id === 'state_pension') f = 1 + 2 * (G.x.ageing - G.ref.ageing);
      else if (p.id === 'healthcare_spending') f = 1 + 1.4 * (G.x.ageing - G.ref.ageing) + .5 * (G.x.pandemic_risk - G.ref.pandemic_risk);
      else if (p.id === 'housing_benefit') f = 1 + 1.5 * (G.x.poverty - G.ref.poverty);
      else if (p.id === 'social_care_funding') f = 1 + 1.5 * (G.x.ageing - G.ref.ageing);
      else if (p.id === 'child_benefit') f = 1 + .6 * (G.x.poverty - G.ref.poverty);
      else if (p.id === 'prison_funding') f = 1 + .8 * (G.x.crime - G.ref.crime);
      const amt = n.cost * gdp * x * G.spendScale * corrOvh * (1 - save) * Math.max(.3, f);
      if (amt > 1e-9) { lines.push({ id: p.id, name: p.name, cat: p.cat, amt, kind: 'spend' }); spend += amt; if (p.id === 'helicopter_money') printed += amt; }
    }
  }
  const yieldPct = .5 + 10 * G.x.bond_yield;
  const debt = G.eco.debt;
  const interest = Math.max(0, debt) * yieldPct / 100 * .85;
  const admin = gdp * G.adminShare * (1 + .4 * (G.ref.bureaucracy_efficiency - G.x.bureaucracy_efficiency));
  lines.push({ id: '_interest', name: 'Debt Interest', cat: 'bank', amt: interest, kind: 'spend' });
  lines.push({ id: '_admin', name: 'Administration', cat: 'gov', amt: admin, kind: 'spend' });
  spend += interest + admin;
  if (SC.expansionBudget) for (const line of SC.expansionBudget(G)) { lines.push(line); spend += line.amt; }
  const qe = useTargets ? SC.polNorm(G, 'quantitative_easing', true) : G.x.quantitative_easing;
  printed += qe * .02 * gdp;
  return { rev, spend, lines, interest, admin, printed, deficit: spend - rev };
};

/* Calibrate revenue & spending scales so the opening budget matches the country */
SC.calibrateBudget = function (G, C) {
  const gdp = G.eco.gdp;
  G.revScale = 1; G.spendScale = 1; G.adminShare = .04;
  const raw = SC.budget(G, false);
  const revRaw = raw.rev;
  G.revScale = revRaw > 0 ? (C.taxShare * gdp) / revRaw : 1;
  const b1 = SC.budget(G, false);
  const target = b1.rev + C.deficit * gdp - b1.admin - b1.interest;
  const spRaw = b1.spend - b1.admin - b1.interest;
  G.spendScale = spRaw > 0 ? Math.max(.25, target / spRaw) : 1;
};

SC.stepEconomy = function (G) {
  const b = SC.budget(G, false);
  G.eco.rev = b.rev; G.eco.spend = b.spend; G.eco.deficit = b.deficit; G.eco.interest = b.interest; G.eco.lines = b.lines;
  G.eco.debt += (b.deficit - b.printed) / 4;
  G.eco.debt = Math.max(G.eco.debt, -.3 * G.eco.gdp);
  if (G.gov) { G.gov.lastCost = G.gov.pendingCost; G.gov.pendingCost = 0; }
  const g = -.06 + .14 * G.x.gdp_growth;
  G.eco.gdp *= 1 + g / 4;
  SC.setVars(G);
  return b;
};

SC.setVars = function (G) {
  const gdp = G.eco.gdp, x = G.x;
  x.deficit_gdp = SC.clamp(.5 + (G.eco.deficit || 0) / gdp * 5);
  x.debt_gdp = SC.clamp(G.eco.debt / gdp / 2.5);
  x.tax_burden = SC.clamp((G.eco.rev || 0) / gdp / .6);
  x.spend_gdp = SC.clamp((G.eco.spend || 0) / gdp / .7);
  x.popularity = G.poll ? SC.clamp(G.poll.s[0]) : .44;
  x.avg_mood = G.avgMood != null ? G.avgMood : .5;
};

/* ---- Department multipliers from ministers ------------------------- */
SC.deptMults = function (G) {
  G.dm = {}; G.dmSave = {};
  for (const d in SC.DEPTS) {
    const m = G.cabinet[d];
    if (!m) { G.dm[d] = .8; G.dmSave[d] = 0; continue; }
    const tr = SC.D.traits.find(t => t.id === m.trait) || {};
    const expBonus = Math.min(m.exp || 0, 12) / 12 * .08;
    const comp = SC.clamp(m.comp + (tr.comp || 0) + expBonus, .1, 1);
    G.dm[d] = SC.clamp(.82 + .36 * comp + (tr.eff || 0), .75, 1.3);
    G.dmSave[d] = tr.save || 0;
  }
};

/* ---- Stat update ----------------------------------------------------- */
SC.modSum = function (G, id) {
  let s = 0;
  for (const m of G.mods) if (m.id === id) s += m.amt * (m.left / m.tot);
  return s;
};

SC.updateStats = function (G, noNoise) {
  const R = SC.reg, x = G.x, tg = {};
  const shock = G.diff.shock;
  const treaty = G.treatyAdd || {};
  for (const n of R.list) {
    if (n.type !== 'stat') continue;
    let t = G.ref[n.id];
    for (const e of R.E.inn[n.id]) {
      const src = R.N[e.from];
      let dx;
      if (src.type === 'situation') dx = x[e.from];
      else dx = x[e.from] - G.ref[e.from];
      if (dx === 0) continue;
      let v = e.w * SC.curve(e.c, dx);
      if (src.type === 'policy') v *= G.dm[src.dept] || 1;
      t += v;
    }
    t += SC.modSum(G, n.id) + (treaty[n.id] || 0) + (G.gov && G.gov.effects[n.id] || 0);
    if (!noNoise) {
      const sd = (n.cat === 'wor' ? .022 : n.id === 'gdp_growth' ? .011 : .004) * shock;
      t += SC.gauss(G.rng) * sd;
    }
    tg[n.id] = SC.clamp(t, .0, 1);
  }
  for (const id in tg) {
    const rate = R.N[id].rate * (G.o.rateMult || 1);
    x[id] = SC.clamp(x[id] + (tg[id] - x[id]) * rate);
  }
  G.target = tg;
};

/* ---- Policy implementation lag -------------------------------------- */
SC.stepPolicies = function (G) {
  for (const p of SC.D.policies) {
    const n = SC.reg.N[p.id], pol = G.pol[p.id];
    const goal = pol.lvl / n.steps, cur = G.x[p.id];
    if (Math.abs(goal - cur) < 1e-6) { G.x[p.id] = goal; continue; }
    const step = 1 / n.impl;
    G.x[p.id] = cur < goal ? Math.min(goal, cur + step * Math.abs(goal - pol.from) ) : Math.max(goal, cur - step * Math.abs(pol.from - goal));
    if (n.steps === 1 || n.impl <= 1) G.x[p.id] = goal;
  }
};

/* ---- Situations ------------------------------------------------------ */
SC.updateSituations = function (G) {
  const R = SC.reg, x = G.x, started = [], ended = [];
  for (const s of SC.D.situations) {
    const n = R.N[s.id];
    const forced = G.sitForce[s.id] > 0;
    const on = !!G.sits[s.id];
    let allTrue = true;
    for (const c of n.conds) { const v = x[c.id]; if (c.op === '<' ? !(v < c.v) : !(v > c.v)) { allTrue = false; break; } }
    const first = n.conds[0];
    let keep = false;
    if (on) { const v = x[first.id]; keep = first.op === '<' ? v < n.off : v > n.off; }
    if (forced) { G.sitForce[s.id]--; }
    const active = forced || (on ? (keep || allTrue) : allTrue);
    if (active) {
      const v = x[first.id], span = n.span || .22;
      let sev = Math.min(1, Math.max(.25, Math.abs(v - first.v) / span + .25));
      if (forced) sev = Math.max(sev, .7);
      x[s.id] = sev;
      if (!on) { G.sits[s.id] = { since: G.turn }; started.push(s.id); }
    } else {
      x[s.id] = 0;
      if (on) { delete G.sits[s.id]; ended.push(s.id); }
    }
  }
  /* apply situation effects as modifiers to other nodes through updateStats (edges from situations use x[sit] as dx) */
  return { started, ended };
};

/* ---- Modifiers ------------------------------------------------------ */
SC.tickMods = function (G) {
  for (const m of G.mods) m.left--;
  G.mods = G.mods.filter(m => m.left > 0);
  for (const k in G.moodMod) { G.moodMod[k] *= .78; if (Math.abs(G.moodMod[k]) < .002) delete G.moodMod[k]; }
  for (const k in G.flags) { if (G.flags[k] > 0) { G.flags[k]--; if (G.flags[k] === 0) delete G.flags[k]; } }
};
SC.addMod = function (G, id, amt, dur) {
  if (!SC.reg.N[id]) return;
  G.mods.push({ id, amt, left: dur || 8, tot: dur || 8 });
  /* immediate partial push so effects are visible right away */
  if (SC.reg.N[id].type === 'stat') G.x[id] = SC.clamp(G.x[id] + amt * .35);
};

/* ---- Preview of staged changes -------------------------------------- */
SC.previewStaged = function (G) {
  const R = SC.reg, out = {}, mood = {};
  for (const id in G.staged) {
    const n = R.N[id], oldX = G.pol[id].lvl / n.steps, newX = G.staged[id] / n.steps;
    if (oldX === newX) continue;
    for (const e of R.E.out[id]) {
      const dy = e.w * (SC.curve(e.c, newX - G.ref[id]) - SC.curve(e.c, oldX - G.ref[id])) * (G.dm[n.dept] || 1);
      if (e.kind === 'like') mood[e.to] = (mood[e.to] || 0) + dy;
      else out[e.to] = (out[e.to] || 0) + dy;
    }
  }
  return { stats: out, mood };
};

<script>
/* STATECRAFT — politics: cabinet, legislature, elections, coalitions, movements */

SC.dist = function (a, b) { let d = 0; for (let i = 0; i < 5; i++) { const df = a[i] - b[i]; d += SC.AXW[i] * df * df; } return Math.sqrt(d); };
SC.closeness = (a, b) => 1 - SC.dist(a, b) / 2.2;

/* ---------- ministers ---------- */
SC.namePool = function (cid) {
  const m = { usa: 'anglo', uk: 'anglo', canada: 'anglo', australia: 'anglo', france: 'french', germany: 'german', switzerland: 'german',
    italy: 'latin', spain: 'latin', brazil: 'latin', japan: 'japanese', sweden: 'nordic', poland: 'slavic', southafrica: 'african', india: 'indian' };
  return m[cid] || 'anglo';
};
SC.genMinister = function (G, dept, opts) {
  opts = opts || {};
  const r = G.rng, pool = SC.D.names[SC.namePool(G.country)] || SC.D.names.anglo;
  const fem = r() < .46;
  const first = SC.pick(r, fem ? pool.f : pool.m), last = SC.pick(r, pool.l);
  const trait = opts.trait ? SC.D.traits.find(t => t.id === opts.trait) : SC.pick(r, SC.D.traits);
  const groupIds = SC.D.groups.filter(g => g.id !== 'everyone').map(g => g.id);
  const sup = trait.mood ? trait.mood.split(',') : [];
  while (sup.length < 2) { const g = SC.pick(r, groupIds); if (sup.indexOf(g) < 0) sup.push(g); }
  const ideo = G.pIdeo[0].map(v => SC.clamp(v + SC.gauss(r) * .3, -1, 1));
  return {
    id: 'm' + Math.floor(r() * 1e9).toString(36), name: first + ' ' + last, gender: fem ? 'f' : 'm', age: 38 + Math.floor(r() * 30),
    dept, trait: trait.id, comp: SC.clamp(.35 + .5 * r() + SC.gauss(r) * .06, .2, .97), loyal: SC.clamp(.35 + .55 * r(), .2, .97),
    corr: SC.clamp(r() * .35 + (trait.corr || 0), 0, .85), exp: trait.exp ? trait.exp : Math.floor(r() * (opts.maxExp == null ? 6 : opts.maxExp)),
    ideo, sup: sup.slice(0, 2), skin: Math.floor(r() * 6), hair: Math.floor(r() * 7), hcol: Math.floor(r() * 6), glasses: r() < .3 ? 1 : 0,
    hired: G.turn, scandals: 0
  };
};
SC.genCabinet = function (G) {
  G.cabinet = {};
  for (const d in SC.DEPTS) G.cabinet[d] = SC.genMinister(G, d, { maxExp: 8 });
  G.pool = {};
  for (const d in SC.DEPTS) G.pool[d] = [SC.genMinister(G, d, { maxExp: 4 }), SC.genMinister(G, d, { maxExp: 4 }), SC.genMinister(G, d, { maxExp: 4 })];
};
SC.minTrait = m => SC.D.traits.find(t => t.id === m.trait) || {};
SC.minQuality = function (G, m) {
  const tr = SC.minTrait(m);
  const align = SC.clamp(1.05 - SC.dist(m.ideo, G.pIdeo[0]) / 3, .55, 1.1);
  return (.5 * SC.clamp(m.loyal + (tr.loyalty || 0), .1, 1) + .5 * SC.clamp(m.comp + (tr.comp || 0), .1, 1)) * align;
};
SC.pcIncome = function (G) {
  let inc = 4 + G.diff.pcInc + (G.x.popularity - .4) * 14 + (G.x.party_unity - .5) * 6;
  for (const d in G.cabinet) { const m = G.cabinet[d]; if (!m) continue; inc += .85 * SC.minQuality(G, m) + (SC.minTrait(m).pc || 0) * .8 + (m.exp >= 8 ? .1 : 0); }
  if (G.flags.emergency) inc += 10;
  if (G.coal) inc += 1.5 * (G.coal.mood - .5);
  return SC.clamp(inc * (G.o.pcMult || 1), 4, 42);
};
/* Persistent mood effect of ministers who have followings */
SC.cabinetMood = function (G) {
  const out = {};
  for (const d in G.cabinet) { const m = G.cabinet[d]; if (!m) continue; for (const g of m.sup) out[g] = (out[g] || 0) + .018 * SC.minQuality(G, m); }
  return out;
};

/* ---------- legislature ---------- */
SC.legSystem = G => ['fptp', 'mixed', 'pr'][G.pol.voting_system.lvl] || 'fptp';

SC.lawSupport = function (G, pid, newLvl, whip) {
  const n = SC.reg.N[pid], leg = G.leg;
  const dir = SC.sgn(newLvl - G.pol[pid].lvl);
  let yes = leg.seats[0] * (.72 + .28 * G.x.party_unity);
  let partner = 0;
  if (G.coal) { partner = G.coal.partner; yes += leg.seats[partner] * (G.coal.mood > .35 ? .9 : .5); }
  for (let p = 1; p < 3; p++) {
    if (p === partner) continue;
    let frac;
    if (!n.iP) frac = .8;
    else { let a = 0; for (const t of n.iP) a += t.w * dir * G.pIdeo[p][SC.AX.indexOf(t.t)]; frac = SC.clamp(.5 + a * 1.1, 0, 1); }
    yes += leg.seats[p] * frac;
  }
  const share = yes / leg.total + (whip ? .06 : 0);
  return share;
};

/* ---------- elections ---------- */
SC.fptpSeats = function (G, nSeats) {
  const wins = [0, 0, 0], regWin = G.regions.map(() => [0, 0, 0]);
  const tot = G.regions.reduce((s, r) => s + r.pop, 0);
  G.regions.forEach((rg, ri) => {
    const nC = Math.max(1, Math.round(nSeats * rg.pop / tot));
    for (let k = 0; k < nC; k++) {
      let best = -1, bv = -9;
      for (let p = 0; p < 3; p++) { const v = G.regShare[ri][p] + SC.gauss(G.rng) * .16; if (v > bv) { bv = v; best = p; } }
      wins[best]++; regWin[ri][best]++;
    }
  });
  return { wins, regWin };
};

SC.dynLeadership = function (G) {

SC.resolveEvent = function (G, ev, idx) {

<script>
/* STATECRAFT — world engine: diplomacy, treaties, war, media */

SC.initWorld = function (G) {
  G.world = { nations: {} };
  for (const n of SC.D.nations) G.world.nations[n.id] = { rel: n.rel0 + Math.round((G.rng() - .5) * 8), tens: n.hostile * .5, treaties: [], sanctions: false, cd: {} };
  G.war = null; G.treatyAdd = {};
};

SC.natById = id => SC.D.nations.find(n => n.id === id);

SC.worldTurn = function (G) {
  const W = G.world, add = {};
  let sumRel = 0, maxT = 0;
  for (const nat of SC.D.nations) {
    const st = W.nations[nat.id];
    const base = 50 + 38 * (SC.closeness(G.pIdeo[0], nat.ideo) - .5) - nat.hostile * 32 + (G.x.foreign_relations - .5) * 28 + st.treaties.length * 7 - (st.sanctions ? 25 : 0) + (G.x.international_standing - .5) * 10;
    st.rel = SC.clamp(st.rel + (base - st.rel) * .07 + SC.gauss(G.rng) * 1.6, -100, 100);
    st.tens = SC.clamp(nat.hostile * .45 + (50 - st.rel) / 140 + G.x.global_tension * .35 - st.treaties.length * .05, 0, 1);
    for (const k in st.cd) { st.cd[k]--; if (st.cd[k] <= 0) delete st.cd[k]; }
    sumRel += st.rel; if (st.tens > maxT) maxT = st.tens;
    /* treaty effects */
    for (const tid of st.treaties) {
      const t = SC.D.treaties.find(x => x.id === tid); if (!t) continue;
      for (const f of SC.parseFx(t.fx)) add[f.t] = (add[f.t] || 0) + f.w * nat.gdp * (1 + (st.rel - 50) / 200);
    }
    if (st.sanctions) { add.exports = (add.exports || 0) - .012 * nat.gdp; }
    /* treaty lapse when relations collapse */
    if (st.rel < 5 && st.treaties.length && G.rng() < .2) { const lost = st.treaties.pop(); G.newsQueue.push('Diplomatic rupture: the ' + lost + ' arrangement with ' + nat.n + ' collapses.'); }
  }
  const avg = sumRel / SC.D.nations.length;
  add.foreign_relations = (add.foreign_relations || 0) + (avg - 50) / 500;
  add.foreign_threat = (add.foreign_threat || 0) + Math.max(0, maxT - .35) * .09;
  G.treatyAdd = add;
  G.worldAvgRel = avg; G.worldMaxTens = maxT;

};

SC.canAct = function (G, action, natId) {
  const st = G.world.nations[natId];
  if (st.cd[action.id]) return { ok: false, why: 'Available again in ' + st.cd[action.id] + ' turns' };
  if (action.minRel && st.rel < action.minRel) return { ok: false, why: 'Needs relations of ' + action.minRel + '+' };
  if (!G.o.sandbox && G.pc < action.pc) return { ok: false, why: 'Needs ' + action.pc + ' political capital' };
  return { ok: true };
};
SC.doAction = function (G, actionId, natId) {
  const a = SC.D.actions.find(x => x.id === actionId), st = G.world.nations[natId], nat = SC.natById(natId);
  const chk = SC.canAct(G, a, natId); if (!chk.ok) return chk;
  if (!G.o.sandbox) G.pc -= a.pc;
  st.rel = SC.clamp(st.rel + a.rel, -100, 100); st.cd[a.id] = a.cd;
  if (a.id === 'sanction') st.sanctions = true;
  if (a.e) { const e = Object.assign({}, a.e); if (e.tens) { st.tens = SC.clamp(st.tens + e.tens, 0, 1); delete e.tens; } SC.applyEffect(G, e); }
  if (a.id === 'summit' && st.sanctions && st.rel > 40) st.sanctions = false;
  return { ok: true, msg: a.n + ' with ' + nat.n + ': relations ' + (a.rel > 0 ? 'improve' : 'worsen') + '.' };
};
SC.liftSanctions = function (G, natId) { const st = G.world.nations[natId]; if (!st.sanctions) return; st.sanctions = false; st.rel = Math.min(100, st.rel + 8); };
SC.signTreaty = function (G, treatyId, natId) {
  const t = SC.D.treaties.find(x => x.id === treatyId), st = G.world.nations[natId], nat = SC.natById(natId);
  if (st.treaties.indexOf(treatyId) >= 0) return { ok: false, why: 'Already in force' };

  if (!G.o.sandbox && G.pc < t.pc) return { ok: false, why: 'Needs ' + t.pc + ' political capital' };

};
SC.cancelTreaty = function (G, treatyId, natId) {
  const st = G.world.nations[natId]; const i = st.treaties.indexOf(treatyId); if (i < 0) return;
  st.treaties.splice(i, 1); st.rel = Math.max(-100, st.rel - 12);

/* ---------- war ---------- */
SC.warDefaults = function (w) {
  const defaults = { strategy: 'balanced', mobilization: 0, supply: 1, readiness: 1, weariness: 0, casualties: 0, cost: 0, enemyReadiness: 1, momentum: 0, turns: 0 };
  for (const k in defaults) if (w[k] == null) w[k] = defaults[k];

SC.startWar = function (G, natId) {

  G.world.nations[natId].rel = -80;

};
SC.setWarPlan = function (G, plan) {

SC.endWar = function (G, outcome) {

  if (G.gov) {
    G.gov.leader.stress = SC.clamp(G.gov.leader.stress + (lost ? .1 : -.05));
    if (won && w.goal === "occupation") { SC.addMod(G, "international_standing", -.08, 12); SC.govCharge(G, .012); G.warResult.occupation = true; }
    if (lost) SC.govCharge(G, .008);

  SC.applyEffect(G, { s: { national_pride: won ? .08 : lost ? -.08 : -.01, leader_approval: won ? .07 : lost ? -.08 : .01, international_standing: won ? .03 : lost ? -.04 : .01, foreign_threat: won ? -.06 : lost ? .05 : -.02 }, news: outcome.toUpperCase() + ': War with ' + SC.natById(w.nation).n + ' ends after ' + w.turns + ' quarters.' });
};
SC.offerPeace = function (G) {
  if (!G.war) return { ok: false, why: 'No active war' };
  const w = SC.warDefaults(G.war);
  if (w.turns < 2) return { ok: false, why: 'Negotiations open after two quarters' };
  if (w.peaceTurn === G.turn) return { ok: false, why: 'One peace offer per quarter' };
  w.peaceTurn = G.turn;
  if (w.momentum > .4 || w.enemyReadiness < .55 || w.turns >= 8) { SC.endWar(G, 'ceasefire'); return { ok: true, msg: 'Ceasefire agreed.' }; }
  return { ok: false, why: 'Opponent rejects the offer. You can surrender or try next quarter.' };
};
SC.warTurn = function (G) {
  if (!G.war) return;
  const w = SC.warDefaults(G.war), nat = SC.natById(w.nation);
  w.turns++; G.sitForce.at_war = 2;
  const allies = Object.entries(G.world.nations).filter(([id, n]) => id !== w.nation && n.rel > 40 && n.treaties.includes('defence')).length;
  const recon = G.gov && G.gov.intel.recon[w.nation] > G.turn ? .05 : 0;
  const pact = G.gov && G.gov.assembly.bloc === 'security' ? .07 : 0;
  const attack = w.strategy === 'offensive' ? .10 : w.strategy === 'defensive' ? -.07 : 0;
  const power = .5 * G.x.military_strength + .15 * G.x.national_security + .1 * G.x.intelligence + .08 * G.x.cyber_defence + Math.min(.14, allies * .07) + .18 + recon + pact;
  const advantage = power * w.readiness + w.mobilization * .065 + attack - nat.str * (.55 + .25 * w.enemyReadiness) - .2;
  w.momentum = SC.clamp(w.momentum + advantage * .65 + SC.gauss(G.rng) * .07, -1.5, 1.5);
  w.fronts.forEach((front,i) => { front.progress = SC.clamp(front.progress + advantage * (i === w.theatre ? .75 : .25) + SC.gauss(G.rng) * .025, -1, 1); });
  const losses = Math.max(.008, .025 + nat.str * .02 + attack * .15 - w.supply * .005);
  w.casualties += Math.round(G.C.pop * 1000000 * losses * .001);

  w.enemyReadiness = SC.clamp(w.enemyReadiness - Math.max(.01, power * .05 + attack * .1), .1, 1);
  w.weariness = SC.clamp(w.weariness + .04 + w.mobilization * .02 + losses, 0, 1);
  const cost = G.eco.gdp * (.004 + w.supply * .002 + w.mobilization * .002);
  w.cost += cost; /* Debt is booked once through the quarterly operating budget. */
  SC.addMod(G, 'gdp_growth', -.01 - w.mobilization * .005, 2);
  SC.addMod(G, 'leader_approval', -w.weariness * .012, 2);
  G.newsQueue.push('War report: momentum ' + Math.round(w.momentum * 100) + ', readiness ' + Math.round(w.readiness * 100) + '%, cumulative casualties ' + w.casualties + '.');
  if (w.turns >= 3 && w.momentum >= (w.goal === "defend" ? .7 : w.goal === "occupation" ? 1.3 : 1)) SC.endWar(G, 'victory');

/* ---------- media ---------- */
SC.initMedia = function (G) {
  const vt = G.vt, outs = SC.D.outlets;
  const r = SC.mkRng((G.seed ^ 0x51ed27) | 0);
  const tot = outs.reduce((s, o) => s + o.reach, 0);
  for (let i = 0; i < vt.n; i++) {
    if (r() > .82) { vt.aud[i] = -1; continue; }
    let best = -1, bv = -9;
    for (let k = 0; k < outs.length; k++) {
      const o = outs[k]; let v = o.reach * 2.5 + (o.state ? .05 : SC.closeness([vt.ido[i * 5], vt.ido[i * 5 + 1], vt.ido[i * 5 + 2], vt.ido[i * 5 + 3], vt.ido[i * 5 + 4]], o.ideo)) * 1.2 + r() * .45;

SC.mediaTurn = function (G, sentiment) {

    let a;

    else a = (SC.closeness(G.pIdeo[0], o.ideo) - .5) * 1.7 + sentiment * .5 + (G.x.media_tone - .5) * .9;
    a = SC.clamp(a * (o.state ? 1 : (0.7 + .3 * o.cred)), -1, 1);

/* Build headlines from what happened this turn. stories: [{kind, name, good, val, dir, w}] */
SC.headline = function (G, o, tone, s) {
  const p = tone > .25 ? 'f' : tone < -.25 ? 'h' : 'n', pick = arr => SC.pick(G.rng, arr);

    case 'policy': {
      const verb = s.dir > 0 ? 'raises' : 'cuts';
      if (p === 'f') return pick(['Bold move: government ' + verb + ' ' + nm, 'Ministers ' + verb + ' ' + nm + ' in decisive step', 'Government ' + verb + ' ' + nm + ' as promised']);
      if (p === 'h') return pick(['Anger as ministers ' + verb + ' ' + nm, nm + ' shake-up ' + (s.dir > 0 ? 'hits families' : 'raises alarm'), 'Critics round on government over ' + nm + ' change']);
      return pick(['Government ' + verb + ' ' + nm, nm + ' ' + (s.dir > 0 ? 'increased' : 'reduced') + ' in latest package']);
    }
    case 'stat':
      if (s.good) {
        if (p === 'f') return pick([nm + ' improves to ' + v + ': government success', 'Progress on ' + nm.toLowerCase() + ' — figures hailed as vindication']);
        if (p === 'h') return pick(['Experts doubt ' + nm.toLowerCase() + ' gains will last', 'Ministers claim credit as ' + nm.toLowerCase() + ' edges up']);
        return pick([nm + ' improves to ' + v, nm + ' up in latest figures']);
      } else {
        if (p === 'f') return pick([nm + ' dips, but ministers vow action', 'Setback on ' + nm.toLowerCase() + ' blamed on global conditions']);
        if (p === 'h') return pick(['Crisis deepens as ' + nm.toLowerCase() + ' slides to ' + v, nm + ' slump piles pressure on ' + 'the government']);
        return pick([nm + ' worsens to ' + v, nm + ' falls in latest figures']);
      }
    case 'sit':
      if (s.start) {
        if (s.good) return p === 'h' ? pick(['Government touts ' + nm.toLowerCase() + ' while others struggle']) : pick([nm + ' arrives', 'Good news: ' + nm.toLowerCase() + ' takes hold']);
        if (p === 'f') return pick(['Government responds to ' + nm.toLowerCase()]);
        if (p === 'h') return pick(['Ministers blamed as ' + nm.toLowerCase() + ' grips nation', nm + ': who is in charge?']);
        return pick([nm + ' takes hold across ' + G.C.name, 'Warning signs as ' + nm.toLowerCase() + ' emerges']);
      } else return p === 'h' ? pick(['Relief, but ' + nm.toLowerCase() + ' scars will remain']) : pick([nm + ' finally ends', 'End of ' + nm.toLowerCase() + ' welcomed']);
    case 'poll': {
      const d = s.dir;
      if (p === 'f') return d >= 0 ? pick(['Poll boost for ' + G.parties[0].n + ' — ' + v]) : pick(['Poll wobble is just noise, say allies (' + v + ')']);
      if (p === 'h') return d >= 0 ? pick(['Poll bounce is fragile, warn analysts (' + v + ')']) : pick(['Poll slump for ' + G.parties[0].n + ': ' + v, 'Voters turning away: ' + v]);
      return pick(['Latest poll: ' + G.parties[0].n + ' on ' + v, 'Opinion poll puts ' + G.parties[0].n + ' at ' + v]);
    }

  }
  return nm;
};
SC.makeNews = function (G, stories) {
  const outs = SC.D.outlets, news = [];
  const ss = stories.slice().sort((a, b) => b.w - a.w);
  const queued = G.newsQueue.splice(0);
  outs.forEach((o, i) => {
    const tone = G.mediaTone[i] || 0;
    let s = null;
    if (queued.length && (i === 0 || G.rng() < .4)) s = { kind: 'text', name: queued[i % queued.length], w: 1 };
    else if (ss.length) {
      /* hostile outlets prefer bad news, friendly prefer good */
      const scored = ss.map(t => ({ t, sc: t.w * (1 + (tone > .25 ? (t.good ? .6 : -.4) : tone < -.25 ? (t.good ? -.4 : .6) : 0)) + G.rng() * .3 }));
      scored.sort((a, b) => b.sc - a.sc); s = scored[Math.min(scored.length - 1, Math.floor(G.rng() * Math.min(3, scored.length)))].t;
    }
    if (s) news.push({ outlet: o.id, text: SC.headline(G, o, tone, s), tone: tone > .25 ? 'pro' : tone < -.25 ? 'anti' : 'neutral' });

};
